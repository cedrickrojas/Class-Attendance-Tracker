<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Class Trackerbonia</title>

    <base href="/" />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0b0f14" />

    <!-- iOS PWA / standalone hints -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Class Trackerbonia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body>
    <!--
      Paints the moment the web view has the HTML, long before the bundle has
      parsed. Vue clears this container when it mounts, so nothing needs to
      remove it. The colours match the app shell so there is no flash.
    -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f6f8;
      }
      #boot span {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        border: 2.5px solid rgba(0, 0, 0, 0.14);
        border-top-color: #3880ff;
        animation: boot-spin 0.7s linear infinite;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #0b0f14;
        }
        #boot span {
          border-color: rgba(255, 255, 255, 0.16);
          border-top-color: #4c8dff;
        }
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <div id="app">
      <div id="boot"><span></span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
